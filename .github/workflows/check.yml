name: Checks

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # .style (Regelwerk) und tests/stubs (Kernel-Stub), beide gepinnt
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: PHP-Syntax
        run: |
          php -l ebusdMQTTDevice/module.php
          php -l libs/eBUS_MQTT_Helper.php
          php -l tests/check_locale.php
          php -l tests/harness.php
          php -l tests/golden_regression.php
          php -l tests/check_presentations.php
          php -l tests/check_circuit_options.php
          php -l tests/check-status-log.php
          php -l tests/check-request-action.php
          php -l tests/check-script-api.php
      - name: Code-Stil (gemeinsames Regelwerk, Submodul .style)
        run: |
          wget -q https://cs.symfony.com/download/php-cs-fixer-v3.phar
          PHP_CS_FIXER_IGNORE_ENV=1 php php-cs-fixer-v3.phar fix --config=.style/.php-cs-fixer.php --dry-run --diff --using-cache=no --allow-risky=yes

      - name: JSON-Validität
        run: |
          find . -name '*.json' -not -path './.git/*' -not -path './tests/stubs/*' -print0 |
            xargs -0 -n1 php -r 'json_decode(file_get_contents($argv[1]), false, 512, JSON_THROW_ON_ERROR); echo $argv[1], " ok\n";' --
      - name: Übersetzungen
        run: php tests/check_locale.php
      - name: Darstellungsparameter
        run: php tests/check_presentations.php
      - name: Golden-Regression
        run: php tests/golden_regression.php
      - name: Schaltkreis-Auswahl
        run: php tests/check_circuit_options.php

      - name: Modultests
        run: for t in tests/check-*.php; do echo "== $t"; php "$t" || exit 1; done
